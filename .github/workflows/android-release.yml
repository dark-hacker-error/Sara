name: Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for the release (e.g. 0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK}" ]]; then
            SDK="/usr/local/lib/android/sdk"
          fi
          echo "Using Android SDK at ${SDK}"
          echo "ANDROID_HOME=${SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "$GITHUB_ENV"

          # Note: android-actions/setup-android@v3 is deliberately not used. It runs
          # `sdkmanager tools`, and that package has been removed from the SDK repository,
          # which fails the step. The runner image already ships a full SDK; we only add the
          # pieces this project pins.
          SDKMANAGER=$(find "${SDK}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)
          if [[ -n "${SDKMANAGER}" ]]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER}" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
              || echo "::warning::Explicit SDK install failed; AGP will auto-download what it needs."
          else
            echo "::warning::sdkmanager not found; relying on AGP's SDK auto-download."
          fi

          ls "${SDK}/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version_name }}" ]]; then
            NAME="${{ github.event.inputs.version_name }}"
          else
            # One rolling release: every push to main refreshes this same tag/asset.
            NAME="0.1.0"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Write local.properties
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Grant gradlew execute permission
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: android
        env:
          SARA_VERSION_NAME: ${{ steps.version.outputs.name }}
          SARA_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Optional release signing. If these secrets are absent the build falls back to the
          # debug keystore so an installable APK is always produced.
          SARA_KEYSTORE_PATH: ${{ secrets.SARA_KEYSTORE_PATH }}
          SARA_KEYSTORE_PASSWORD: ${{ secrets.SARA_KEYSTORE_PASSWORD }}
          SARA_KEY_ALIAS: ${{ secrets.SARA_KEY_ALIAS }}
          SARA_KEY_PASSWORD: ${{ secrets.SARA_KEY_PASSWORD }}
        run: |
          if [[ -n "${SARA_KEYSTORE_PATH}" && -f "${SARA_KEYSTORE_PATH}" ]]; then
            echo "Signing with the provided release keystore."
          else
            echo "No release keystore supplied; the APK will be debug-signed (still installable)."
          fi
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [[ -z "${SRC}" ]]; then
            echo "No APK produced"; exit 1
          fi
          DEST="sara-${{ steps.version.outputs.name }}.apk"
          cp "${SRC}" "${DEST}"
          echo "path=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh "${DEST}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sara-apk-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          NOTES="Sara ${TAG}

          Android voice assistant: Gemini Live for real-time speech, a FastAPI + ADK
          backend for planning, accessibility for phone control.

          Install: download the APK, allow install from unknown sources, then grant
          Microphone, Accessibility, overlay and notification permissions in Sara's setup
          screen. Add a Gemini API key and point Settings at your backend.

          What is still a stub is listed in the README."

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${{ steps.apk.outputs.path }}" --clobber
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" "${{ steps.apk.outputs.path }}" \
              --title "Sara ${TAG}" \
              --notes "${NOTES}"
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
